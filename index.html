<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>NiuSX 导航页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            font-size: 2rem;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 15px 0;
        }
        a {
            font-size: 1.2rem;
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .desc {
            color: #586069;
            font-size: 0.85rem;
            margin-left: 0;
            display: block;
        }
    </style>
</head>
<body>
    <h1>📁 NiuSX 内容导航</h1>
    <ul>
        <li>
            <a href="/blog/">📝 博客 Blog</a>
            <span class="desc">我的个人博客文章</span>
        </li>
        <!-- 如果你想添加更多链接，可以复制下面这一段并修改 -->
        <!--
        <li>
            <a href="/notes/">📚 学习笔记</a>

        </li>
        <li>
            <a href="/projects/">🛠️ 项目展示</a>
            <span class="desc">我的开源项目列表</span>
        </li>
        -->
    </ul>
</body>
</html>
